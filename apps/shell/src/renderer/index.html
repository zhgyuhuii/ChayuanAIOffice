      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #fafafa;
      }
      #boot img {
        width: 64px;
        height: 64px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .boot-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .boot-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: #333;
        letter-spacing: 0.5px;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      #root:not(:empty) ~ #boot {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease;
      }
