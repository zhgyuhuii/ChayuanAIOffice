<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenOffice</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font: 13px/1.4 system-ui, sans-serif;
        background: #1e1f22;
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #tabs {
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        background: #2b2d30;
        flex: none;
        overflow-x: auto;
      }
      .tab {
        padding: 6px 14px;
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        border: none;
        background: transparent;
        color: #b8b8b8;
        font: inherit;
        white-space: nowrap;
      }
      .tab.active { background: #1e1f22; color: #fff; }
      .tab:hover:not(.active) { background: #3a3c3f; }
      #new-tab {
        align-self: center;
        padding: 2px 10px;
        border-radius: 6px;
        border: 1px solid #4a4c4f;
        background: transparent;
        color: #b8b8b8;
        cursor: pointer;
      }
      #views { flex: 1; position: relative; min-height: 0; }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
        display: none;
      }
      iframe.active { display: block; }
      #offline {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="tabs"></div>
    <div id="views"></div>
    <div id="offline">Editor not reachable — start it with <code>npm run dev</code></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
