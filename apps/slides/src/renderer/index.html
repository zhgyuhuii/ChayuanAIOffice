<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- script-src 'wasm-unsafe-eval': harfbuzzjs text shaping; media-src includes the slide-media
         protocol: embedded audio/video play from Range-served chaoffice-slide-media:// URLs -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: chaoffice-slide-media:; font-src 'self' data: blob:; media-src 'self' data: blob: chaoffice-slide-media:; worker-src 'self' blob:; connect-src 'self' blob: chaoffice-slide-media: ws://localhost:*"    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./app-icon-64.png" />
    <title>ChaAI Office Slides</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
