      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: chatoffice-docx-media:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data: blob: ws://localhost:* chatoffice-docx-media:; media-src 'self' data: blob:;"
    />

    <link rel="icon" type="image/png" href="./app-icon-64.png" />
