# ChatOffice full stack (single-artifact private deployment, plan v2.1 decision #9).
# The SaaS staging environment runs this same file with cloud-scaled parameters.
#
#   docker compose -f docker/docker-compose.yml up

services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      CHATOFFICE_DATA_DIR: /data
      CHATOFFICE_AUTH: ${CHATOFFICE_AUTH:-off} # 'jwt' once Logto is wired
      # POSTGRES_URL: postgresql://chatoffice:${POSTGRES_PASSWORD}@postgres:5432/chatoffice
      # S3_ENDPOINT: http://minio:9000
    ports:
      - '52587:8787'
    volumes:
      - server-data:/data
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chatoffice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatoffice}
      POSTGRES_DB: chatoffice
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatoffice']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chatoffice}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chatoffice-secret}
    ports:
      - '9001:9001'
    volumes:
      - minio-data:/data

  # Logto (product accounts, decision #3): uncomment when wiring auth.
  # logto:
  #   image: svhd/logto:latest
  #   depends_on: [postgres]
  #   environment:
  #     TRUST_PROXY_ENDPOINT: http://localhost:3001
  #     DB_URL: postgresql://chatoffice:${POSTGRES_PASSWORD:-chatoffice}@postgres:5432/logto
  #     ENDPOINT: http://localhost:3001
  #   ports:
  #     - '3001:3001'
  #     - '3002:3002'

volumes:
  server-data:
  postgres-data:
  minio-data:
