<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>ribbon playground</title>
    <link rel="stylesheet" href="./tab-strip.css" />
    <link rel="stylesheet" href="./controls.css" />
    <style>
      /* the three chrome rules DesktopRibbon relies on hosts for (standalone demo) */
      body {
        margin: 0;
        font-family:
          -apple-system,
          'PingFang SC',
          sans-serif;
        background: #f6f6f6;
      }
      .ribbon {
        position: relative;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-bottom: 1px solid #e1e1e1;
      }
      .ribbon-tabs {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 36px;
        padding: 0 12px;
      }
      .ribbon-tab {
        border: 0;
        background: none;
        padding: 6px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
      }
      .ribbon-tab.active {
        color: #c8102e;
        font-weight: 600;
      }
      .ribbon-tabs-spacer {
        flex: 1;
      }
      .ribbon-body {
        display: flex;
        align-items: stretch;
        min-height: 0;
        padding: 4px 12px 2px;
        position: relative;
      }
      .ribbon-group {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-shrink: 0;
        padding: 0 6px;
        position: relative;
      }
      .ribbon-group-items {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: 1;
      }
      .ribbon-sep {
        width: 1px;
        flex-shrink: 0;
        background: var(--rb-sep);
        margin: 4px 0;
      }
      .ribbon-group-label {
        display: block;
        font-size: 11px;
        color: #8a8a8a;
        text-align: center;
        padding-top: 2px;
        line-height: 14px;
      }
      .rb-big {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        border: none;
        background: none;
        border-radius: 4px;
        padding: 4px 7px 6px;
        font-size: 12px;
        cursor: pointer;
      }
      .rb-big:hover:not(:disabled) {
        background: #ecf2fb;
      }
      .rb-big-icon {
        display: inline-flex;
        width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
      }
      .rb-small,
      .rb-icon {
        border: none;
        background: none;
        border-radius: 3px;
        min-width: 28px;
        height: 30px;
        font-size: 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .rb-small:hover:not(:disabled),
      .rb-icon:hover:not(:disabled) {
        background: #ecf2fb;
      }
      .rb-split-wrap {
        position: relative;
        display: inline-flex;
      }
      .rb-caret {
        border: 0;
        background: none;
        width: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .ribbon-collapse-btn {
        position: absolute;
        right: 6px;
        bottom: 2px;
        border: 0;
        background: none;
        color: #888;
        cursor: pointer;
      }
      .demo-icon {
        font-size: 17px;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>
